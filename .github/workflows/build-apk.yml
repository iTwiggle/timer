name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
      - native-android-mvp-v01
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RandomChime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling dev release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RandomChime-debug.apk
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest \
              --title "Latest dev build" \
              --notes "Rolling build - replaced on every push." \
              --prerelease
          fi
          gh release upload dev-latest RandomChime-debug.apk --clobber
          printf '%s\n' \
            "Rolling dev build. This tag always holds the newest APK." \
            "" \
            "Branch: ${{ github.ref_name }}" \
            "Commit: ${{ github.sha }}" \
            "Built:  $(date -u '+%Y-%m-%d %H:%M UTC')" > notes.md
          gh release edit dev-latest --notes-file notes.md
